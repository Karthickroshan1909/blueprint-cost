
name: Build and deploy Python app to Azure Web App - blueprint-cost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: azure-blueprint-cost/app
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: azure-blueprint-cost/app/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_64EDE1E4CB70435F826F84610DEC0ECE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FBBC5A64AC3847C58640C4A1B989B3E4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7F8E2A69614A4C9698A7AAE7298D48EE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: blueprint-cost
          slot-name: Production
          package: .
